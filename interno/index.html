 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:d(S),iterations:IT,hash:'SHA-256'},m,256))}
async function dec(raw){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d(I)},key,d(C)))}
function show(h){document.open();document.write(h);document.close()}
const b64=a=>btoa(String.fromCharCode(...a));
(async()=>{try{const s=localStorage.getItem('mdx-k');if(s)show(await dec(d(s)))}catch(e){try{localStorage.removeItem('mdx-k')}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const E=document.getElementById('e');E.textContent='Verificando…';
 let h,raw;try{raw=await k(document.getElementById('u').value,document.getElementById('p').value);h=await dec(raw)}catch(x){E.textContent='Usuario o contraseña incorrectos.';return}
 if(document.getElementById('r').checked){try{localStorage.setItem('mdx-k',b64(raw))}catch(_){}}
 show(h)});
</script></body></html>
